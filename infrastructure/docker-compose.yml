name: knowflow

x-planned-services:
  backend:
    description: FastAPI application service will be added after the backend runtime is initialized.
    future_port: 8000
  frontend:
    description: Vite React application service will be added after the frontend runtime is initialized.
    future_port: 5173

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["platform"]
    environment:
      POSTGRES_DB: knowflow
      POSTGRES_USER: knowflow
      POSTGRES_PASSWORD: knowflow_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["platform"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
